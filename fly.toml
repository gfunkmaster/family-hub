# Fly.io: `fly launch --no-deploy --copy-config` första gången, sedan `fly deploy`. Se docs/drift.md.
app = "family-hub"
primary_region = "arn"

[build]
  dockerfile = "Dockerfile"

[deploy]
  # Kör databasmigreringar innan den nya versionen tar emot trafik.
  release_command = "npm run db:migrate -w @family-hub/web"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
